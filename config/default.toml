[paths]
kit_dir = "D:/tictokJam/kuairand-starter-kit"
data_dir = "D:/tictokJam/Kuairand/KuaiRand-Pure/data"
# Optional. Probe also discovers siblings of data_dir (KuaiRand-1K/data, KuaiRand-27K/data).
# data_1k_dir = "D:/tictokJam/Kuairand/KuaiRand-1K/data"
# data_27k_dir = "D:/tictokJam/Kuairand/KuaiRand-27K/data"
# Pin the run's task instance at launch (also --data-scale / KUAI_DATA_SCALE).
# data_scale = "pure"
paper_roots = [
  "D:/tictokJam/NISE",
  "D:/tictokJam/torch-rechub",
  "D:/tictokJam/CWM",
]

[search]
num_drafts = 3
max_debug_depth = 3
debug_prob = 0.25
epsilon = 0.002
patience_n = 3
max_iterations = 50
trial_timeout_sec = 1200
# Official §2.3/§2.6: 50-iter hard cap + 6 h wall-clock. Self-discipline may pass --max-iters.
wall_clock_sec = 21600

[parallel]
# Ablate 3-seed jobs run as isolated subprocesses. Greedy remains the search policy.
enabled = true
n_workers = 3
max_workers = 4

[jump]
# DeepFM/DCNv2 are local `arch` keys now. Jump hook kept for later modules.
enabled = true
auto_unlock = false
stagnation_rounds = 3
delta_threshold = 0.002
architectures = ["deepfm", "dcnv2"]

[multitask]
# Reserved. Kit pins long_view as the scored task; click is auxiliary.
enabled = false
main_task = "long_view"
auxiliary = ["is_click", "is_like", "is_follow", "is_comment", "is_forward"]

[error_memory]
enabled = true
backend = "token_overlap"
topk = 3

[llm]
# auto: uses .env key if present, else dummy
provider = "auto"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
temperature = 0.3

[observe]
heartbeat_sec = 15

[knowledge]
# Offline: LLM may read files under paper_roots / templates (cheap).
paper_read = true
# Online: arXiv API, capped. Off by default; enable with --research for A/B.
research = false
research_max = 5
