<svg viewBox="0 0 1000 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-title flowchart-desc">
      <title id="flowchart-title">Champion-challenger search loop flowchart</title>
      <desc id="flowchart-desc">Top-down loop: propose one atomic change, screen on one seed, ablate on three seeds, promote or reject, then stop at ε=0.002 / N=3 or the 50-iteration / 6 h cap and finalize the CSV.</desc>
      <defs>
        <marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a9ec9"/></marker>
        <marker id="flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ARROWS -->
      <!-- Start -> Propose -->
      <line x1="500" y1="120" x2="500" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <!-- Propose -> Screen -->
      <line x1="500" y1="248" x2="500" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <!-- Screen PASS -> Ablate (south vertex to north vertex) -->
      <line x1="500" y1="360" x2="500" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <rect x="508" y="380" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="526" y="389" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>
      <!-- Screen FAIL: west vertex, left, up, into Propose left face -->
      <path d="M 380,320 H 288 Q 280,320 280,312 V 216 Q 280,208 288,208 H 420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <rect x="292" y="300" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="304" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <!-- Ablate 3/3: west vertex into Promote right face -->
      <line x1="380" y1="460" x2="200" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <rect x="256" y="440" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="270" y="449" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3/3</text>
      <!-- Ablate NO: east vertex, right bus, into Propose right (upper attach) -->
      <path d="M 620,460 H 752 Q 760,460 760,452 V 204 Q 760,196 752,196 H 580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <rect x="700" y="440" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="718" y="449" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO 3/3</text>
      <!-- Promote -> Converged (bottom then into north vertex) -->
      <path d="M 120,500 V 552 Q 120,560 128,560 H 492 Q 500,560 500,568 V 580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <!-- Converged YES -> Finalize -->
      <line x1="500" y1="660" x2="500" y2="720" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <rect x="508" y="680" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="522" y="689" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <!-- Converged NOT YET: east vertex, outer bus, Propose right (lower attach) -->
      <path d="M 620,620 H 792 Q 800,620 800,612 V 228 Q 800,220 792,220 H 580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <rect x="748" y="420" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="770" y="429" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOT YET</text>

      <!-- NODES -->
      <rect x="420" y="40" width="160" height="80" rx="20" fill="#f5f5f5"/>
      <rect x="420" y="40" width="160" height="80" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Start</text>
      <text x="500" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Draft 0 · official FM</text>

      <rect x="420" y="168" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="168" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Propose arm</text>
      <text x="500" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one atomic change</text>

      <polygon points="500,280 620,320 500,360 380,320" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Screen</text>
      <text x="500" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 gates · 1 seed</text>

      <polygon points="500,420 620,460 500,500 380,460" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ablate</text>
      <text x="500" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3/3 same-sign</text>

      <rect x="40" y="420" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="420" width="160" height="80" rx="6" fill="rgba(74,158,201,0.10)" stroke="#4a9ec9" stroke-width="1"/>
      <text x="120" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Promote</text>
      <text x="120" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">new incumbent · bag</text>

      <polygon points="500,580 620,620 500,660 380,620" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="616" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Converged?</text>
      <text x="500" y="632" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ε=0.002 · N=3 · 50/6h</text>

      <rect x="400" y="720" width="200" height="80" rx="20" fill="#f5f5f5"/>
      <rect x="400" y="720" width="200" height="80" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="760" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Finalize</text>
      <text x="500" y="776" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">train-only → CSV</text>

      <line x1="40" y1="844" x2="960" y2="844" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="864" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="852" width="28" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="156" y="864" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">start / end</text>
      <rect x="280" y="852" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="316" y="864" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">step</text>
      <polygon points="456,860 468,852 480,860 468,868" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="488" y="864" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">decision</text>
      <rect x="600" y="852" width="16" height="16" rx="3" fill="rgba(74,158,201,0.10)" stroke="#4a9ec9" stroke-width="1"/>
      <text x="624" y="864" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">promote</text>
    </svg>