<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Autonomous ranking agent architecture</title>
      <desc id="architecture-desc">Three-row architecture: the orchestrator proposes one-arm changes to an isolated trial scored by kit evaluate.py, promotion gates write a verdict into memory, and on stop finalize writes submission.csv. Test labels are never read during search.</desc>
      <defs>
        <marker id="arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ZONES -->
      <rect x="24" y="68" width="952" height="132" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="72" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="66" y="81" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SEARCH</text>

      <rect x="24" y="248" width="952" height="124" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="252" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="66" y="261" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DECIDE</text>

      <rect x="24" y="408" width="952" height="124" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="412" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="60" y="421" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EMIT</text>

      <!-- ARROWS -->
      <!-- LLM -> Orchestrator -->
      <line x1="200" y1="136" x2="256" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <rect x="208" y="116" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="228" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PATCH</text>
      <!-- Orchestrator -> LLM (journal context) -->
      <line x1="256" y1="156" x2="200" y2="156" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
      <!-- Orchestrator -> Trial -->
      <line x1="464" y1="140" x2="560" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <!-- Trial -> evaluate.py -->
      <line x1="720" y1="140" x2="776" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <rect x="724" y="120" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">scores.npz</text>
      <!-- evaluate.py -> Orchestrator bottom (primary), never along a side -->
      <path d="M 856,180 V 204 Q 856,212 848,212 H 432 Q 424,212 424,204 V 188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <rect x="600" y="192" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="628" y="201" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRIMARY</text>
      <!-- Orchestrator -> Memory (read journal) -->
      <path d="M 300,188 V 240 Q 300,248 292,248 H 152 Q 144,248 144,256 V 280" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
      <!-- Orchestrator -> Gates (top port) -->
      <path d="M 380,188 V 240 Q 380,248 388,248 H 642 Q 650,248 650,256 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <!-- Gates -> Memory (shared row, into right face) -->
      <line x1="560" y1="320" x2="248" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <rect x="372" y="300" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="398" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT</text>
      <!-- Orchestrator -> Finalize via empty center column, not through Gates -->
      <path d="M 340,188 V 392 Q 340,400 348,400 H 632 Q 640,400 640,408 V 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <rect x="456" y="380" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="389" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ON STOP</text>
      <!-- Finalize -> submission.csv -->
      <line x1="720" y1="480" x2="776" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>

      <!-- NODES -->
      <rect x="40" y="100" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="100" width="160" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="48" y="106" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="62" y="115" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="120" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM Planner</text>
      <text x="120" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deepseek-v4-flash</text>

      <rect x="256" y="92" width="208" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="92" width="208" height="96" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="264" y="98" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="278" y="107" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="360" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orchestrator</text>
      <text x="360" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">champion-challenger</text>

      <rect x="560" y="100" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="100" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="106" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="582" y="115" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRIAL</text>
      <text x="640" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trial Sandbox</text>
      <text x="640" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">numpy FM + BPR</text>

      <rect x="776" y="100" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="100" width="160" height="80" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="784" y="106" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="798" y="115" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KIT</text>
      <text x="856" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kit evaluate.py</text>
      <text x="856" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GAUC · nDCG@5</text>

      <rect x="40" y="280" width="208" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="280" width="208" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="48" y="286" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="62" y="295" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="144" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Memory</text>
      <text x="144" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">journal · seeds · facts</text>

      <rect x="560" y="280" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="280" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="286" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="582" y="295" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="650" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Promote Gates</text>
      <text x="650" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">screen → ablate</text>

      <rect x="560" y="440" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="440" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="446" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="582" y="455" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="640" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Finalize</text>
      <text x="640" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retrain train-only</text>

      <rect x="776" y="440" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="440" width="160" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="784" y="446" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="798" y="455" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
      <text x="856" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">submission.csv</text>
      <text x="856" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">170,588 rows</text>

      <line x1="24" y1="556" x2="976" y2="556" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="120" y1="572" x2="152" y2="572" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="160" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">control / scores</text>
      <line x1="320" y1="572" x2="352" y2="572" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="360" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">read journal</text>
      <rect x="500" y="564" width="16" height="12" rx="2" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
      <text x="524" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">orchestrator</text>
      <rect x="680" y="564" width="16" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="704" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">kit contract</text>
    </svg>